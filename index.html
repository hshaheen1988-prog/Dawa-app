<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>دوائي</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root {
  --bg: #f2f5f4;
  --card: #ffffff;
  --card-2: #f7faf9;
  --text: #13201e;
  --muted: #5f6f6c;
  --faint: #8fa09c;
  --line: #e2e8e6;
  --brand: #0f766e;
  --brand-2: #14b8a6;
  --brand-soft: #e0f2ef;
  --on-brand: #ffffff;
  --ok: #15803d;
  --ok-soft: #dcfce7;
  --warn: #b45309;
  --warn-soft: #fef3c7;
  --bad: #b91c1c;
  --bad-soft: #fee2e2;
  --hero-1: #0f766e;
  --hero-2: #0d9488;
  --shadow: 0 1px 2px rgba(16,40,36,.05), 0 6px 20px rgba(16,40,36,.06);
  --radius: 20px;
}
:root[data-theme="dark"] {
  --bg: #0b1211; --card: #141d1c; --card-2: #192321; --text: #e7efed; --muted: #9db0ac; --faint: #6f817d;
  --line: #243230; --brand: #2dd4bf; --brand-2: #5eead4; --brand-soft: #10302c; --on-brand: #04201c;
  --ok: #4ade80; --ok-soft: #12301d; --warn: #fbbf24; --warn-soft: #33270c; --bad: #f87171; --bad-soft: #3a1616;
  --hero-1: #0f3d38; --hero-2: #115e56; --shadow: none;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --bg: #0b1211; --card: #141d1c; --card-2: #192321; --text: #e7efed; --muted: #9db0ac; --faint: #6f817d;
    --line: #243230; --brand: #2dd4bf; --brand-2: #5eead4; --brand-soft: #10302c; --on-brand: #04201c;
    --ok: #4ade80; --ok-soft: #12301d; --warn: #fbbf24; --warn-soft: #33270c; --bad: #f87171; --bad-soft: #3a1616;
    --hero-1: #0f3d38; --hero-2: #115e56; --shadow: none;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); }
body {
  font-family: system-ui, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif;
  font-size: 16px; line-height: 1.5; min-height: 100vh;
  padding-bottom: calc(92px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; }
button:active { transform: scale(.97); }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
svg { flex: none; }

/* ---------- Hero ---------- */
.hero {
  background: linear-gradient(145deg, var(--hero-1), var(--hero-2));
  color: #fff; padding: calc(16px + env(safe-area-inset-top)) 16px 64px;
  border-radius: 0 0 28px 28px; position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; width: 240px; height: 240px; border-radius: 50%;
  background: rgba(255,255,255,.07); top: -90px; inset-inline-start: -60px;
}
.hero-in { max-width: 640px; margin: 0 auto; position: relative; z-index: 1; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.greet { font-size: 14px; opacity: .85; }
.hello { font-size: 24px; font-weight: 700; line-height: 1.25; }
.hero-date { font-size: 13px; opacity: .8; margin-top: 2px; }
.hbtn {
  width: 42px; height: 42px; border-radius: 14px; border: none; display: grid; place-items: center;
  background: rgba(255,255,255,.16); color: #fff;
}
.hbtn svg { width: 22px; height: 22px; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin-top: 14px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: flex; align-items: center; gap: 6px; border: none;
  background: rgba(255,255,255,.14); color: #fff; padding: 5px 12px 5px 5px; border-radius: 999px; font-size: 14px;
}
html[dir="ltr"] .chip { padding: 5px 12px 5px 5px; }
html[dir="rtl"] .chip { padding: 5px 5px 5px 12px; }
.chip.on { background: #fff; color: var(--hero-1); font-weight: 600; }
.chip .av { width: 24px; height: 24px; font-size: 12px; }
.av {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  color: #fff; font-weight: 700; flex: none;
}

main { max-width: 640px; margin: -48px auto 0; padding: 0 16px; position: relative; z-index: 2; }

/* ---------- Cards ---------- */
.card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); }
:root[data-theme="light"] .card, :root[data-theme="auto"] .card { border-color: transparent; }
.stack { display: grid; gap: 12px; }
.sec-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--muted); margin: 20px 4px 10px; }
.sec-title svg { width: 18px; height: 18px; }
.sec-title .cnt { margin-inline-start: auto; font-weight: 500; font-size: 13px; }

/* Next dose */
.next { display: flex; align-items: center; gap: 14px; }
.next .ring-wrap { position: relative; width: 76px; height: 76px; flex: none; }
.ring { width: 76px; height: 76px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; }
.ring .track { stroke: var(--brand-soft); }
.ring .fill { stroke: var(--brand); stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1); }
.ring-lbl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1; }
.ring-lbl b { font-size: 18px; }
.ring-lbl small { font-size: 11px; color: var(--muted); display: block; }
.next-info { flex: 1; min-width: 0; }
.next-k { font-size: 12px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: .3px; }
.next-name { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.next-when { font-size: 14px; color: var(--muted); }
.next.alert .next-k { color: var(--warn); }
.next.done .next-k { color: var(--ok); }

/* Week strip */
.week-head { display: flex; align-items: center; justify-content: space-between; margin: 16px 4px -6px; font-size: 14px; font-weight: 700; color: var(--muted); }
.week-head button { border: none; background: var(--card); box-shadow: var(--shadow); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--brand); display: flex; align-items: center; gap: 6px; }
.week-head button svg { width: 16px; height: 16px; }
.cal button.c { border: none; font: inherit; cursor: pointer; }
.cal.month .c { flex-direction: column; gap: 0; line-height: 1.1; position: relative; font-size: 14px; font-weight: 700; color: var(--text); }
.cal.month .c small { font-size: 10px; font-weight: 600; opacity: .7; }
.cal.month .c .inr-dot { position: absolute; top: 4px; inset-inline-end: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--bad); }
.cal .c { display: flex; align-items: center; justify-content: center; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 14px; }
.wday {
  border: none; background: var(--card); border-radius: 14px; padding: 8px 0 6px; text-align: center;
  box-shadow: var(--shadow); border: 1px solid var(--line); display: grid; gap: 2px; justify-items: center;
}
:root[data-theme="light"] .wday, :root[data-theme="auto"] .wday { border-color: transparent; }
.wday .d { font-size: 11px; color: var(--muted); }
.wday .n { font-size: 16px; font-weight: 700; }
.wday .dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.wday .dot.full { background: var(--ok); } .wday .dot.part { background: var(--warn); } .wday .dot.miss { background: var(--bad); } .wday .dot.todo { background: var(--line); }
.wday.today .n { color: var(--brand); }
.wday.sel { background: var(--brand); border-color: var(--brand); }
.wday.sel .d, .wday.sel .n { color: var(--on-brand); }
.back-today { border: none; background: none; color: var(--brand); font-weight: 600; font-size: 13px; padding: 4px 8px; }

/* Dose cards */
.dose { display: flex; align-items: center; gap: 12px; padding: 12px; position: relative; overflow: hidden; }
.dose::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 4px; background: var(--mc, var(--brand)); }
.micon { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.micon svg { width: 28px; height: 28px; }
.dose .info { flex: 1; min-width: 0; }
.dose .name { font-weight: 700; overflow-wrap: anywhere; line-height: 1.3; }
.dose .sub { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 13px; color: var(--muted); margin-top: 2px; }
.tag { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--card-2); color: var(--muted); white-space: nowrap; }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.brand { background: var(--brand-soft); color: var(--brand); }
.acts { display: flex; gap: 6px; flex: none; align-items: center; }
.b-take {
  border: none; height: 44px; min-width: 44px; padding: 0 14px; border-radius: 14px; font-weight: 700; font-size: 14px;
  background: var(--brand); color: var(--on-brand); display: flex; align-items: center; gap: 4px;
}
.b-take svg { width: 18px; height: 18px; }
.b-more {
  border: none; width: 36px; height: 44px; border-radius: 12px; background: var(--card-2); color: var(--muted);
  display: grid; place-items: center;
}
.b-more svg { width: 20px; height: 20px; }
.dose.taken { opacity: .7; }
.dose.taken .name { text-decoration: line-through; text-decoration-color: var(--faint); }
.state-btn { border: none; background: none; display: grid; justify-items: center; gap: 2px; padding: 2px; }
.state-btn small { font-size: 11px; color: var(--muted); }
.check { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
.check svg { width: 20px; height: 20px; }
.check.ok { background: var(--ok-soft); color: var(--ok); }
.check.bad { background: var(--bad-soft); color: var(--bad); }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.check.anim { animation: pop .35s ease-out; }

/* PRN */
.prn { display: flex; align-items: center; gap: 12px; padding: 12px; }
.b-soft { border: none; background: var(--brand-soft); color: var(--brand); font-weight: 700; font-size: 14px; border-radius: 12px; padding: 10px 14px; }

/* Empty */
.empty { text-align: center; padding: 28px 16px 24px; }
.empty svg { width: 120px; height: 100px; margin-bottom: 8px; }
.empty h3 { font-size: 17px; margin-bottom: 4px; }
.empty p { color: var(--muted); font-size: 14px; margin-bottom: 14px; }

/* ---------- Buttons & forms ---------- */
.btn {
  border: none; border-radius: 14px; padding: 13px 18px; font-weight: 700; width: 100%;
  background: var(--brand); color: var(--on-brand); display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn.ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--line); }
.btn.soft { background: var(--brand-soft); color: var(--brand); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.small { width: auto; padding: 8px 14px; font-size: 14px; border-radius: 12px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.field { margin-bottom: 16px; }
.lbl { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
.hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
input, select, textarea {
  width: 100%; border: 1.5px solid var(--line); background: var(--card-2); border-radius: 12px; padding: 12px;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); background: var(--card); }
input[type="time"], input[type="date"], input[type="tel"], input[type="number"] { direction: ltr; }
html[dir="rtl"] input[type="time"], html[dir="rtl"] input[type="date"] { text-align: right; }
.x-btn { flex: none; width: 44px; height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--bad); font-size: 22px; line-height: 1; }
.add-link { background: none; border: 1.5px dashed var(--line); border-radius: 12px; padding: 11px; width: 100%; color: var(--brand); font-weight: 700; margin-top: 8px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button, .opt {
  border: 1.5px solid var(--line); background: var(--card-2); border-radius: 12px; padding: 10px 6px;
  font-size: 13px; font-weight: 600; color: var(--muted);
}
.seg button.on, .opt.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts .opt { flex: 1 0 auto; padding: 8px 12px; }
.wd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd button { border: 1.5px solid var(--line); background: var(--card-2); border-radius: 10px; padding: 9px 0; font-size: 12px; color: var(--muted); }
.wd button.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 700; }
.shape-pick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.shape-pick button { border: 1.5px solid var(--line); background: var(--card-2); border-radius: 12px; aspect-ratio: 1; display: grid; place-items: center; padding: 0; }
.shape-pick button svg { width: 26px; height: 26px; }
.shape-pick button.on { border-color: var(--brand); background: var(--brand-soft); }
.color-pick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.color-pick button { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--card); box-shadow: 0 0 0 1.5px var(--line); }
.color-pick button.on { box-shadow: 0 0 0 2.5px var(--text); }
.pattern-row .p-lbl { flex: none; width: 70px; font-size: 14px; color: var(--muted); }
.preview { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.pv { text-align: center; border-radius: 10px; padding: 5px 0; background: var(--brand-soft); color: var(--brand); line-height: 1.25; }
.pv.none { background: var(--card-2); color: var(--faint); }
.pv.is-today { box-shadow: inset 0 0 0 2px var(--brand); }
.pv-d { font-size: 10px; } .pv-n { font-size: 11px; opacity: .8; } .pv-a { font-size: 14px; font-weight: 800; }
details.fold { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 16px; }
details.fold > summary { font-weight: 700; cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
details.fold > summary::after { content: "⌄"; margin-inline-start: auto; color: var(--muted); }
details.fold[open] > summary { margin-bottom: 12px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tgl { width: 50px; height: 30px; border-radius: 999px; border: none; background: var(--line); position: relative; flex: none; transition: background .2s; }
.tgl::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: inset-inline-start .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.tgl.on { background: var(--brand); }
.tgl.on::after { inset-inline-start: 23px; }

/* Med list */
.med { display: flex; gap: 12px; padding: 14px; }
.med .body { flex: 1; min-width: 0; }
.med .name { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.med .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
.times { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.times span { background: var(--card-2); color: var(--text); padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.stockbar { height: 6px; border-radius: 999px; background: var(--card-2); overflow: hidden; margin-top: 10px; }
.stockbar i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
.stockbar.low i { background: var(--bad); }
.filter { display: flex; gap: 6px; margin: 4px 0 12px; }
.filter button { border: none; background: var(--card); box-shadow: var(--shadow); padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); }
.filter button.on { background: var(--text); color: var(--bg); }

.inr-card { display: flex; gap: 12px; align-items: center; }
.inr-chart { width: 100%; height: auto; display: block; direction: ltr; }
.inr-pt { cursor: pointer; }
.fam-hub .btn { font-size: 14px; padding: 12px 10px; }
/* Interactions */
.ix { border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.6; border: 1.5px solid var(--line); background: var(--card-2); }
.ix.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.ix.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.ix.brand { background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 30%, transparent); }
.ix.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
.ix-entry { display: flex; gap: 12px; align-items: center; padding: 14px; cursor: pointer; margin-bottom: 12px; }

/* Stats */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kpi { text-align: center; padding: 14px 8px; }
.kpi b { display: block; font-size: 24px; line-height: 1.2; }
.kpi span { font-size: 12px; color: var(--muted); }
.kpi.fire b { color: #ea580c; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal .h { font-size: 10px; text-align: center; color: var(--muted); }
.cal .c { aspect-ratio: 1; border-radius: 8px; background: var(--card-2); display: grid; place-items: center; font-size: 11px; color: var(--muted); }
.cal .c.l1 { background: color-mix(in srgb, var(--bad) 22%, var(--card)); color: var(--text); }
.cal .c.l2 { background: color-mix(in srgb, var(--warn) 30%, var(--card)); color: var(--text); }
.cal .c.l3 { background: color-mix(in srgb, var(--brand) 45%, var(--card)); color: var(--text); }
.cal .c.l4 { background: var(--brand); color: var(--on-brand); font-weight: 700; }
.cal .c.today { box-shadow: inset 0 0 0 2px var(--text); }
.legend { display: flex; gap: 12px; justify-content: center; font-size: 11px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-inline-end: 4px; }
.mstat { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mstat:last-child { border-bottom: none; }
.mstat .bar { flex: 1; height: 8px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
.mstat .bar i { display: block; height: 100%; border-radius: 999px; }
.mstat .nm { width: 38%; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mstat .pc { width: 42px; text-align: end; font-size: 13px; font-weight: 700; }
.range { display: flex; background: var(--card-2); border-radius: 12px; padding: 3px; }
.range button { flex: 1; border: none; background: none; padding: 7px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.range button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); }

/* Family */
.member { display: flex; align-items: center; gap: 12px; padding: 14px; }
.member .body { flex: 1; min-width: 0; }
.mini-bar { height: 6px; border-radius: 999px; background: var(--card-2); overflow: hidden; margin-top: 6px; }
.mini-bar i { display: block; height: 100%; background: var(--brand); }

/* Settings */
.set-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: none; }
.set-row .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; flex: none; }
.set-row .ico svg { width: 20px; height: 20px; }
.set-row .body { flex: 1; min-width: 0; }
.set-row .body small { display: block; font-size: 12px; color: var(--muted); }

/* ---------- Bottom nav ---------- */
nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line); padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
}
.tabs-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 72px 1fr 1fr; align-items: end; }
nav.tabs button.tab {
  background: none; border: none; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 11px; font-weight: 600; padding: 6px 0;
}
nav.tabs button.tab svg { width: 24px; height: 24px; }
nav.tabs button.tab.on { color: var(--brand); }
.fab {
  justify-self: center; width: 58px; height: 58px; border-radius: 20px; border: none; margin-top: -26px;
  background: linear-gradient(145deg, var(--brand-2), var(--brand)); color: #fff;
  box-shadow: 0 8px 20px rgba(15,118,110,.35); display: grid; place-items: center;
}
.fab svg { width: 28px; height: 28px; }

/* ---------- Sheets ---------- */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(5,15,13,.5); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet {
  background: var(--card); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
  border-radius: 24px 24px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom)); animation: up .28s cubic-bezier(.2,.8,.2,1);
}
.sheet .grab { width: 40px; height: 5px; border-radius: 999px; background: var(--line); margin: 0 auto 14px; }
.sheet h3 { font-size: 20px; margin-bottom: 18px; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (min-width: 600px) { .modal { align-items: center; } .sheet { border-radius: 24px; } }
#confirm { z-index: 60; align-items: center; padding: 24px; }
#confirm .sheet { border-radius: 22px; max-width: 360px; text-align: center; padding: 22px 18px; }
#confirm p { margin-bottom: 18px; font-size: 16px; }
.menu-item { width: 100%; border: none; background: none; display: flex; align-items: center; gap: 12px; padding: 14px 6px; font-size: 16px; font-weight: 600; border-bottom: 1px solid var(--line); text-align: start; }
.menu-item:last-child { border-bottom: none; }
.menu-item svg { width: 22px; height: 22px; color: var(--muted); }

/* ---------- Onboarding ---------- */
.onboard { min-height: 100vh; display: flex; flex-direction: column; }
.ob-top {
  background: linear-gradient(160deg, var(--hero-1), var(--hero-2)); color: #fff; text-align: center;
  padding: calc(48px + env(safe-area-inset-top)) 24px 72px; border-radius: 0 0 36px 36px;
}
.ob-top .logo { width: 84px; height: 84px; border-radius: 26px; background: #fff; display: grid; place-items: center; margin: 0 auto 16px; box-shadow: 0 10px 30px rgba(0,0,0,.15); }
.ob-top .logo img { width: 64px; height: 64px; }
.ob-top h1 { font-size: 30px; }
.ob-top p { opacity: .9; margin-top: 4px; }
.ob-feats { display: flex; justify-content: center; gap: 18px; margin-top: 20px; font-size: 12px; opacity: .95; }
.ob-feats div { display: grid; justify-items: center; gap: 6px; }
.ob-feats span { width: 42px; height: 42px; border-radius: 14px; background: rgba(255,255,255,.16); display: grid; place-items: center; }
.ob-feats svg { width: 22px; height: 22px; }
.ob-card { max-width: 440px; width: calc(100% - 32px); margin: -44px auto 24px; }

/* Toast & confetti */
.toast {
  position: fixed; bottom: calc(96px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 14px; z-index: 100;
  font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: up .25s;
  display: flex; gap: 12px; align-items: center;
}
.toast button { border: none; background: none; color: var(--brand-2); font-weight: 800; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fall 1.6s ease-in forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .8; } }
.banner { display: flex; gap: 10px; align-items: center; background: var(--warn-soft); color: var(--warn); border-radius: 16px; padding: 12px 14px; font-size: 14px; font-weight: 600; margin-top: 12px; }
.banner .btn { width: auto; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  <main>

    if (s.status === 'taken') { taken++; due++; }
    else if (s.status === 'skipped') { skipped++; due++; }
    else if (past) { missed++; due++; }
  }
  return { due, taken, skipped, missed, total };
}
function streak(pid) {
  let n = 0; const td = today();
  for (let i = 0; i < 400; i++) {
    const d = addDays(td, -i), s = dayStats(pid, d);
    if (!s.total) { if (i > 60 && n === 0) break; continue; }
    if (d === td && s.taken < s.total) continue;
    if (s.taken === s.total) n++; else break;
  }
  return n;
}

   Today
   ===================================================================== */
function renderToday() {
  const el = document.getElementById('view-today');
  const td = today(), date = viewDate || td, now = nowHM();
  const myMeds = S.meds.filter(m => m.profileId === S.active);
  if (!myMeds.length) {
    el.innerHTML = `<div class="card empty">${emptyArt()}<h3>${t('emptyTitle')}</h3><p>${t('emptyText')}</p>
      <button class="btn" onclick="openMedForm()">${I.plus.replace('<svg', '<svg width="20" height="20"')} ${t('addMed')}</button></div>`;
    return;
  }
  const slots = slotsFor(S.active, date);
  const todaySlots = date === td ? slots : slotsFor(S.active, td);
  const done = todaySlots.filter(s => s.status === 'taken').length;
  const pct = todaySlots.length ? Math.round(done / todaySlots.length * 100) : 0;

  // Next / overdue dose (always about today)
  const pending = todaySlots.filter(s => !s.status);
  const overdue = pending.filter(s => toMin(s.time) < toMin(now));
  const upcoming = pending.filter(s => toMin(s.time) >= toMin(now));
  let cls = '', k = '', name = '', when = '';
  if (!todaySlots.length) { cls = 'done'; k = t('noneToday'); name = '🌿'; }
  else if (!pending.length) { cls = 'done'; k = t('allDone'); name = '🎉'; }
  else if (overdue.length) {
    const s = overdue[overdue.length - 1], diff = toMin(now) - toMin(s.time);
    cls = 'alert'; k = t('lateDose'); name = s.med.name; when = `${fmtTime(s.time)} · ${t('lateBy')(Math.floor(diff / 60), diff % 60)}`;
  } else {
    const s = upcoming[0], diff = toMin(s.time) - toMin(now);
    k = t('nextDose'); name = s.med.name; when = `${fmtTime(s.time)} · ${t('inTime')(Math.floor(diff / 60), diff % 60)}`;
  }
  const nextCard = `<div class="card next ${cls}">
    <div class="ring-wrap">${ringSvg(pct)}<div class="ring-lbl"><div><b class="num">${t('ofDoses')(done, todaySlots.length)}</b><small>${t('doses')}</small></div></div></div>
    <div class="next-info"><div class="next-k">${k}</div><div class="next-name">${esc(name)}</div>${when ? `<div class="next-when num">${when}</div>` : ''}</div>
  </div>`;

  // Week strip: 3 days back, today, 3 days ahead
  const center = viewDate && Math.abs(daysBetween(td, viewDate)) > 3 ? viewDate : td;
  const week = Array.from({ length: 7 }, (_, i) => addDays(center, i - 3)).map(d => {
    const st = dayStats(S.active, d, now, td);
    let dot = '';
    if (st.total) {
      if (d > td) dot = 'todo';
      else if (st.taken === st.total) dot = 'full';
      else if (st.taken > 0 || (d === td && !st.missed)) dot = d === td ? 'todo' : 'part';
      else dot = d === td ? 'todo' : 'miss';
      if (d === td && st.taken === st.total) dot = 'full';
    }
    const dd = D(d);
    return `<button class="wday ${d === td ? 'today' : ''} ${d === date ? 'sel' : ''}" onclick="openDay('${d}')">
      <span class="d">${t('days')[dd.getDay()]}</span><span class="n num">${dd.getDate()}</span><span class="dot ${dot}"></span></button>`;
  }).join('');

  const banner = notifBanner();
  let body = '';
  if (date !== td) {
    body += `<div class="sec-title">${I.clock}<span>${fmtDate(date, { weekday: 'long', day: 'numeric', month: 'long' })}</span>
      <button class="back-today cnt" onclick="pickDay(null)">${t('backToday')}</button></div>`;
  }
  if (!slots.length) {
    body += `<div class="card empty" style="padding:22px"><p style="margin:0">${t('noneToday')} 🌿</p></div>`;
  } else {
    for (const p of ['morning', 'noon', 'evening', 'night']) {
      const group = slots.filter(s => period(s.time) === p);
      if (!group.length) continue;
      const gd = group.filter(s => s.status === 'taken').length;
      body += `<div class="sec-title">${I[PERIOD_ICON[p]]}<span>${t(p)}</span><span class="cnt num">${gd}/${group.length}</span></div>
        <div class="stack">${group.map(s => doseCard(s, date, td, now)).join('')}</div>`;
    }
  }
  // As-needed medicines
  const prnMeds = myMeds.filter(m => isPrn(m) && isActiveOn(m, date) && !m.paused);
  if (prnMeds.length) {
    body += `<div class="sec-title">${I.info}<span>${t('asNeeded')}</span></div><div class="stack">${prnMeds.map(m => {
      const logs = S.prn.filter(x => x.medId === m.id && x.at.slice(0, 10) === date);
      const last = logs[logs.length - 1];
      return `<div class="card prn">${micon(m)}<div class="info" style="flex:1;min-width:0"><div class="name" style="font-weight:700">${esc(m.name)}</div>
        <div class="sub muted" style="font-size:13px">${fmtNum(stageAmount(m, date))} ${esc(m.unit)} · ${t('prnToday')(logs.length, last ? fmtClock(last.at) : '')}</div></div>
        ${date <= td ? `<button class="b-soft" onclick="logPrn('${m.id}')">${t('logDose')}</button>` : ''}
        ${logs.length ? `<button class="b-more" onclick="undoPrn('${m.id}','${date}')" aria-label="${t('undo')}">${I.undo}</button>` : ''}</div>`;
    }).join('')}</div>`;
  }
  const weekHead = `<div class="week-head"><span>${new Date().toLocaleDateString(locale(), { month: 'long', year: 'numeric' })}</span>
    <button onclick="openMonth()">${I.cal} ${t('calendarBtn')}</button></div>`;
  el.innerHTML = nextCard + inrCardHtml(S.active) + weekHead + `<div class="week">${week}</div>` + ramadanBanner() + banner + body;
}

function doseCard(s, date, td, now) {
  const m = s.med;
  const late = !s.status && date === td && toMin(s.time) < toMin(now);
  const missed = !s.status && date < td;
  const tags = [];
  if (m.meal && m.meal !== 'none') tags.push(`<span class="tag brand">${t('meals')[m.meal]}</span>`);
  if (s.snooze && !s.status) tags.push(`<span class="tag warn">${t('snoozedTo')(fmtClock(s.snooze))}</span>`);
  else if (late) tags.push(`<span class="tag warn">${t('late')}</span>`);
  if (missed) tags.push(`<span class="tag bad">${t('missedN')}</span>`);
  if (s.status === 'taken' && s.log?.at) tags.push(`<span class="tag ok">${t('takeAt')(fmtClock(s.log.at))}</span>`);
  if (s.log?.by) tags.push(`<span class="tag brand">👤 ${esc(s.log.by)}</span>`);
  if (s.status === 'skipped') tags.push(`<span class="tag bad">${t('skipped')}</span>`);
  let right;
  if (s.status) {
    right = `<button class="state-btn" onclick="doseMenu('${s.key}')"><span class="check ${s.status === 'taken' ? 'ok' : 'bad'} ${lastMarked === s.key ? 'anim' : ''}">${s.status === 'taken' ? I.check : I.x}</span></button>`;
  } else if (date > td) {
    right = '';
  } else {
    right = `<div class="acts"><button class="b-take" onclick="mark('${s.key}','taken')">${I.check}<span>${t('take')}</span></button>
      <button class="b-more" onclick="doseMenu('${s.key}')" aria-label="more">${I.dots}</button></div>`;
  }
  return `<div class="card dose ${s.status || ''}" style="--mc:${m.color}">${micon(m)}
    <div class="info"><div class="name">${esc(m.name)}</div>
      <div class="sub"><span class="num">${fmtTime(s.time)}</span><span aria-hidden="true">·</span><span>${fmtNum(s.amount)} ${esc(m.unit)}</span></div>
      ${tags.length ? `<div class="sub" style="margin-top:6px">${tags.join('')}</div>` : ''}</div>${right}</div>`;
}
function pickDay(d) { viewDate = d && d !== today() ? d : null; haptic(8); renderToday(); }

let lastMarked = null;
function mark(key, status, quiet) {
  const [medId, date] = key.split('|');
  const med = S.meds.find(m => m.id === medId);
  const was = S.log[key]?.status;
  if (status) S.log[key] = { status, at: new Date().toISOString() };
  else { delete S.log[key]; if (was && S.family) FAM().undo[key] = new Date().toISOString(); }
  delete S.snoozes[key];
  if (med && typeof med.stock === 'number') {
    const amt = amountOn(med, date);
    if (was !== 'taken' && status === 'taken') med.stock = Math.max(0, +(med.stock - amt).toFixed(2));
    if (was === 'taken' && status !== 'taken') med.stock = +(med.stock + amt).toFixed(2);
    checkLowStock(med);
  }
  lastMarked = status ? key : null;
  haptic(status === 'taken' ? [20, 40, 20] : 15);
  save(); render();
  if (!quiet && status) toast(status === 'taken' ? t('doseLogged') : t('skippedMsg'), () => mark(key, was || null, true));
  if (status === 'taken' && date === today()) {
    const st = dayStats(S.active, today());
    if (st.total && st.taken === st.total) confetti();
  }
}
function checkLowStock(med) {
  if (typeof med.stock !== 'number' || med.stock > (med.lowAt ?? 5)) return;
  if (S.notified['low|' + med.id] === today()) return;
  S.notified['low|' + med.id] = today();
  notify(t('stockLowTitle'), t('stockLowBody')(med.name, fmtNum(med.stock)), 'low-' + med.id);
}
function doseMenu(key) {
  const [medId, date] = key.split('|');
  const med = S.meds.find(m => m.id === medId); if (!med) return;
  const st = S.log[key]?.status, isToday = date === today();
  const items = [];
  if (st) items.push(['undo', t('undo'), `closeModal();mark('${key}',null)`]);
  if (st !== 'taken') items.push(['check', t('take'), `closeModal();mark('${key}','taken')`]);
  if (!st && isToday) {
    items.push(['snooze', t('snooze10'), `closeModal();snooze('${key}',10)`]);
    items.push(['snooze', t('snooze30'), `closeModal();snooze('${key}',30)`]);
  }
  if (st !== 'skipped') items.push(['x', t('skip'), `closeModal();mark('${key}','skipped')`]);
  items.push(['edit', t('editMed'), `closeModal();openMedForm('${medId}')`]);
  openModal(`<div class="row" style="margin-bottom:10px">${micon(med)}<div class="grow"><div style="font-weight:700;font-size:17px">${esc(med.name)}</div>
    <div class="muted" style="font-size:13px">${fmtTime(key.split('|')[2])} · ${fmtDate(date, { weekday: 'long', day: 'numeric', month: 'short' })}</div></div></div>
    ${items.map(([ic, label, fn]) => `<button class="menu-item" onclick="${fn}">${I[ic]}${label}</button>`).join('')}`);
}
function snooze(key, mins) {
  const at = new Date(Date.now() + mins * 60000);
  S.snoozes[key] = at.toISOString();
  delete S.notified[key];
  haptic(); save(); render();
  toast(t('snoozedMsg')(fmtClock(at.toISOString())));
}
function logPrn(medId) {
  const m = S.meds.find(x => x.id === medId); if (!m) return;
  const date = viewDate || today();
  const at = date === today() ? new Date() : new Date(date + 'T12:00:00');
  const amount = stageAmount(m, date);
  S.prn.push({ id: uid(), medId, at: at.toISOString(), amount });
  if (typeof m.stock === 'number') { m.stock = Math.max(0, +(m.stock - amount).toFixed(2)); checkLowStock(m); }
  haptic([20, 40, 20]); save(); render(); toast(t('doseLogged'));
}
function undoPrn(medId, date) {
  const idx = S.prn.map((x, i) => [x, i]).filter(([x]) => x.medId === medId && x.at.slice(0, 10) === date).pop();
  if (!idx) return;
  const [entry, i] = idx; S.prn.splice(i, 1);
  const m = S.meds.find(x => x.id === medId);
  if (m && typeof m.stock === 'number') m.stock = +(m.stock + (entry.amount || 0)).toFixed(2);
  save(); render();
}

    if (!NATIVE && 'Notification' in window && Notification.permission === 'default') requestNotif();
  };
}
function readMedForm(f, loose) {
  const name = f.name.value.trim();
  if (!name && !loose) return { error: t('medName') };
  const mode = f.mode.value;
  let times = [...new Set([...f.querySelectorAll('.t-in')].map(i => i.value).filter(Boolean))].sort();
  if (mode === 'prn') times = [];
  else if (!times.length) { if (loose) times = ['08:00']; else return { error: t('needTime') }; }
  const start = f.start.value || today();
  const schedule = { mode };
  if (mode === 'interval') schedule.every = Math.max(2, parseInt(f.every.value) || 2);
  if (mode === 'weekdays') {
    schedule.weekdays = [...f.querySelectorAll('.wd button.on')].map(b => +b.dataset.wd).sort();
    if (!schedule.weekdays.length && !loose) return { error: t('needDay') };
  }
  if (mode === 'pattern') {
    schedule.pattern = [...f.querySelectorAll('.p-amt')].map(i => Math.max(0, parseFloat(i.value) || 0));
    schedule.rest = Math.max(0, parseInt(f.rest.value) || 0);
    if (!schedule.pattern.some(v => v > 0) && !loose) return { error: t('needPattern') };
  }
  const stages = [...f.querySelectorAll('.stage-row')].map(r => ({ from: r.querySelector('.s-from')?.value || start, amount: parseFloat(r.querySelector('.s-amt').value) || 1 }));
  if (stages.length) stages[0].from = stages[0].from < start ? stages[0].from : start;
  const stockVal = f.stock.value.trim();
  return { data: {
    name, unit: f.unit.value, times, start, end: f.end.value, schedule,
    stages: stages.length ? stages : [{ from: start, amount: 1 }],
    stock: stockVal === '' ? null : Math.max(0, parseFloat(stockVal) || 0), lowAt: Math.max(0, parseInt(f.lowAt.value) || 0),
    notes: f.notes.value.trim(), color: f.color.value, shape: f.shape.value, meal: f.meal.value
  } };
}
function updatePreview() {
  const f = document.getElementById('medForm'), box = document.getElementById('preview');
  if (!f || !box) return;
  const r = readMedForm(f, true);
  if (!r.data) { box.innerHTML = ''; return; }
  const med = r.data, from = today() > med.start ? today() : med.start;
  box.innerHTML = Array.from({ length: 14 }, (_, i) => {
    const d = addDays(from, i), a = amountOn(med, d), dt = D(d);
    return `<div class="pv ${a > 0 ? '' : 'none'} ${d === today() ? 'is-today' : ''}"><div class="pv-d">${t('days')[dt.getDay()]}</div>
      <div class="pv-n num">${dt.getDate()}</div><div class="pv-a num">${a > 0 ? fmtNum(a) : '–'}</div></div>`;
  }).join('');
}
function timeRow(v) { return `<div class="row"><input type="time" class="t-in grow" value="${v}"><button type="button" class="x-btn" onclick="this.parentElement.remove()">×</button></div>`; }
function addTimeRow() {
  const last = [...document.querySelectorAll('.t-in')].map(i => i.value).filter(Boolean).sort().pop();
  const next = last ? `${pad(Math.min(23, +last.slice(0, 2) + 8))}:${last.slice(3)}` : '08:00';
  document.getElementById('timesList').insertAdjacentHTML('beforeend', timeRow(next)); updatePreview();
}
function stageRow(s, i) {
  return `<div class="row stage-row">${i ? `<div class="grow"><div class="hint" style="margin:0 0 4px">${t('from')}</div><input type="date" class="s-from" value="${s.from}"></div>` : ''}
    <div class="grow">${i ? `<div class="hint" style="margin:0 0 4px">${t('amount')}</div>` : ''}<input type="number" class="s-amt" min="0.25" step="0.25" value="${s.amount}" inputmode="decimal"></div>
    ${i ? `<button type="button" class="x-btn" style="align-self:flex-end" onclick="this.parentElement.remove()">×</button>` : ''}</div>`;
}
function addStageRow() {
  const rows = [...document.querySelectorAll('.stage-row')], last = rows[rows.length - 1];
  const lastFrom = last?.querySelector('.s-from')?.value || document.querySelector('#medForm [name=start]').value || today();
  document.getElementById('stagesList').insertAdjacentHTML('beforeend', stageRow({ from: addDays(lastFrom, 7), amount: last?.querySelector('.s-amt').value || 1 }, rows.length));
}
function patternRow(v, i) {
  return `<div class="row pattern-row"><span class="p-lbl">${t('dayN')(i + 1)}</span>
    <input type="number" class="p-amt grow" min="0" step="0.25" value="${v}" inputmode="decimal">
    <button type="button" class="x-btn" onclick="removePatternRow(this)">×</button></div>`;
}
function addPatternRow() {
  const rows = document.querySelectorAll('.pattern-row');
  document.getElementById('patternList').insertAdjacentHTML('beforeend', patternRow(rows[rows.length - 1]?.querySelector('.p-amt').value || 1, rows.length));
  updatePreview();
}
function removePatternRow(btn) {
  if (document.querySelectorAll('.pattern-row').length <= 1) return;
  btn.parentElement.remove();
  document.querySelectorAll('.pattern-row .p-lbl').forEach((el, i) => el.textContent = t('dayN')(i + 1));
  updatePreview();
}
async function deleteMed(id) {
  if (!await ask(t('confirmDelMed'), t('del'))) return;
  S.meds = S.meds.filter(m => m.id !== id);
  for (const k of Object.keys(S.log)) if (k.startsWith(id + '|')) delete S.log[k];
  for (const k of Object.keys(S.snoozes)) if (k.startsWith(id + '|')) delete S.snoozes[k];
  S.prn = S.prn.filter(x => x.medId !== id);
  save(); closeModal(); render();
}

/* ---------- matching ---------- */
function normName(s) {
  return String(s || '').toLowerCase()
    .replace(/[ً-ْـ]/g, '')           // Arabic diacritics + tatweel
    .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/چ/g, 'ج').replace(/گ/g, 'ك')
    .replace(/[\s\-_.,/()]+/g, '');
}
const IX_N = IX.map(e => ({ ...e, nn: e.names.map(normName) }));
const TGT_N = Object.fromEntries(Object.entries(TARGETS).map(([k, v]) => [k, v.names.map(normName)]));
function nameHit(q, n) { return q.length >= 3 && (n.startsWith(q) || (n.length >= 4 && q.includes(n)) || (q.length >= 4 && n.includes(q))); }
/** Which target drug (warfarin / acetazolamide) a medicine name refers to, if any. */
function targetOf(name) {
  const q = normName(name);
  return Object.keys(TGT_N).find(k => TGT_N[k].some(n => nameHit(q, n))) || null;
}
/** Interactions of a medicine name with the target drugs. */
function interactionsFor(name, onlyTargets) {
  const q = normName(name);
  if (q.length < 3) return [];
  return IX_N.filter(e => (!onlyTargets || onlyTargets.includes(e.t)) && e.nn.some(n => nameHit(q, n))).sort((a, b) => b.sev - a.sev);
}
function suggestNames(query) {
  const q = normName(query); if (q.length < 2) return [];
  const out = [], seen = new Set();
  const all = [...IX.flatMap(e => e.names), ...Object.values(TARGETS).flatMap(v => v.names)];
  for (const n of all) { const k = normName(n); if (k.startsWith(q) && !seen.has(k)) { seen.add(k); out.push(n); } if (out.length >= 8) break; }
  return out;
}
/** Targets present among a profile's current medicines. */
function profileTargets(pid) {
  const td = today();
  return [...new Set(S.meds.filter(m => m.profileId === pid && (!m.end || m.end >= td)).map(m => targetOf(m.name)).filter(Boolean))];
}
const SEV = { 3: 'bad', 2: 'warn', 1: 'brand' };
function sevLabel(n) { return t('sev')[n]; }
function ixCard(e) {
  const txt = e[S.lang];
  return `<div class="ix ${SEV[e.sev]}"><div class="row" style="align-items:flex-start;gap:10px">
    <span class="tag ${SEV[e.sev]}" style="flex:none">${sevLabel(e.sev)}</span>
    <div class="grow"><div style="font-weight:800">${t('with')} ${TARGETS[e.t][S.lang]} · <span style="font-weight:600">${esc(e.label[S.lang])}</span></div>
    <div style="margin-top:4px">${txt[0]}</div><div class="muted" style="margin-top:4px">👉 ${txt[1]}</div></div></div></div>`;
}

/* ---------- checker sheet ---------- */
function openInteractions(prefill) {
  openModal(`<div class="grab"></div>
    <div class="row" style="margin-bottom:6px"><div class="micon" style="background:var(--brand-soft);color:var(--brand)">${I.shield}</div>
      <div class="grow"><h3 style="margin:0">${t('ixTitle')}</h3><div class="muted" style="font-size:13px">${t('ixWith')}</div></div></div>
    <div class="field" style="margin-top:14px;position:relative">
      <input id="ixQ" placeholder="${t('ixPh')}" autocomplete="off" value="${esc(prefill || '')}">
      <div id="ixSug" class="opts" style="margin-top:8px"></div>
    </div>
    <div id="ixRes"></div>
    <button class="btn soft" style="margin-top:14px" onclick="checkMyMeds()">${I.pill.replace('<svg', '<svg width="20" height="20"')} ${t('ixMine')}</button>
    <p class="muted" style="font-size:12px;margin-top:14px;line-height:1.6">⚠️ ${t('ixDisclaimer')}</p>`);
  const q = document.getElementById('ixQ');
  const run = () => {
    const v = q.value.trim();
    const sug = suggestNames(v).filter(n => normName(n) !== normName(v));
    document.getElementById('ixSug').innerHTML = sug.map(n => `<button type="button" class="opt" onclick="document.getElementById('ixQ').value=this.textContent;document.getElementById('ixQ').dispatchEvent(new Event('input'))">${esc(n)}</button>`).join('');
    document.getElementById('ixRes').innerHTML = ixResultHtml(v);
  };
  q.addEventListener('input', run);
  run();
  if (!prefill) setTimeout(() => q.focus(), 250);
}
function ixResultHtml(v) {
  if (normName(v).length < 3) return '';
  const tg = targetOf(v);
  if (tg) return `<div class="ix brand">${t('ixIsTarget')(TARGETS[tg][S.lang])}</div>`;
  const hits = interactionsFor(v);
  if (!hits.length) return `<div class="ix ok"><b>${t('ixNone')(esc(v))}</b><div class="muted" style="margin-top:4px">${t('ixNoneHint')}</div></div>`;
  return `<div class="stack" style="gap:10px">${hits.map(ixCard).join('')}</div>`;
}
function checkMyMeds() {
  const td = today();
  const meds = S.meds.filter(m => m.profileId === S.active && (!m.end || m.end >= td));
  const mine = profileTargets(S.active);
  const targets = Object.keys(TARGETS);
  const rows = meds.filter(m => !targetOf(m.name)).map(m => ({ m, hits: interactionsFor(m.name, targets) })).filter(r => r.hits.length);
  const res = document.getElementById('ixRes');
  document.getElementById('ixQ').value = '';
  document.getElementById('ixSug').innerHTML = '';
  if (!rows.length) { res.innerHTML = `<div class="ix ok"><b>${t('ixMineNone')}</b><div class="muted" style="margin-top:4px">${t('ixNoneHint')}</div></div>`; return; }
  res.innerHTML = `<div class="stack" style="gap:14px">${rows.map(r => `<div><div class="row" style="margin-bottom:8px">${micon(r.m, 34)}<b>${esc(r.m.name)}</b></div>
    <div class="stack" style="gap:8px">${r.hits.map(e => ixCard(e) + (mine.includes(e.t) ? '' : `<div class="hint" style="margin:-4px 4px 0">${t('ixNotTaking')(TARGETS[e.t][S.lang])}</div>`)).join('')}</div></div>`).join('')}</div>`;
}
/** Warning shown in the medicine form while typing a name. */
function formIxWarning(name) {
  const mine = profileTargets(S.active);
  if (!mine.length) return '';
  const hits = interactionsFor(name, mine);
  if (!hits.length) return '';

  </svg>`;

function hijriMonth(date) {

      const m = +(parts.find(x => x.type === 'month')?.value);

/* =====================================================================

   ===================================================================== */
function amountSpeech(a, unit) {
  a = +a;
  if (S.lang !== 'ar') return `${fmtNum(a)} ${unit}`;
  const whole = Math.floor(a), frac = +(a - whole).toFixed(2);
  const fw = { 0.25: 'ربع', 0.5: 'نص', 0.75: 'ثلاث أرباع' }[frac];
  const pill = unit === 'حبة' || unit === 'كبسولة';
  let w = '';
  if (pill) w = whole === 0 ? '' : whole === 1 ? (fw ? unit : `${unit} ${unit === 'حبة' ? 'وحدة' : 'وحدة'}`) : whole === 2 ? (unit === 'حبة' ? 'حبتين' : 'كبسولتين') : `${whole} ${unit === 'حبة' ? 'حبات' : 'كبسولات'}`;
  else w = whole ? `${whole} ${unit}` : '';
  if (!fw) return w || `${fmtNum(a)} ${unit}`;
  if (!whole) return `${fw} ${unit}`;
  return `${w} و${fw}`;
}
function speechFor(p, slots) {
  const self = p.id === S.profiles[0]?.id;
  const head = S.lang === 'ar' ? (self ? `حان موعد دوائك يا ${p.name}` : `حان موعد دواء ${p.name}`)
    : (self ? `${p.name}, it's time for your medicine` : `It's time for ${p.name}'s medicine`);
  const meds = slots.map(s => `${s.med.name}، ${amountSpeech(s.amount, s.med.unit)}${s.med.meal && s.med.meal !== 'none' ? '، ' + t('meals')[s.med.meal] : ''}`);
  return `${head}. ${meds.join('. ')}.`;
}
function testVoice() {
  const p = S.profiles.find(x => x.id === S.active) || S.profiles[0];
  const m = S.meds.find(x => x.profileId === p.id && !isPrn(x));

  if (nativeHas('testVoice')) { DawaNative.testVoice(text, S.lang); return; }

}

  try {

    const u = new SpeechSynthesisUtterance(text); u.lang = S.lang === 'ar' ? 'ar-JO' : 'en-GB'; u.rate = .95;

/* =====================================================================

   ===================================================================== */
function widgetData() {
  const td = today(), tm = addDays(td, 1), days = {}, groups = new Map();
  for (const d of [td, tm]) {
    let total = 0, done = 0;
    for (const p of S.profiles) for (const s of slotsFor(p.id, d)) {
      total++; if (s.status === 'taken') done++;
      if (s.status) continue;
      const snz = S.snoozes[s.key] ? Date.parse(S.snoozes[s.key]) : null;
      const at = snz || new Date(`${d}T${s.time}:00`).getTime();
      const gk = p.id + '|' + d + '|' + s.time;
      if (!groups.has(gk)) groups.set(gk, { date: d, at, time: fmtTime(s.time), person: p.name, color: p.color, parts: [], keys: [] });
      const g = groups.get(gk); g.parts.push(`${s.med.name} · ${fmtNum(s.amount)} ${s.med.unit}`); g.keys.push(s.key);
    }
    days[d] = { total, done };
  }
  const items = [...groups.values()].sort((a, b) => a.at - b.at).slice(0, 30)
    .map(g => ({ date: g.date, at: g.at, time: g.time, person: S.profiles.length > 1 ? g.person : '', text: g.parts.join('\n'), keys: g.keys.join(',') }));

    const nx = S.inr[p.id]?.next;

  }
  for (const f of (S.family?.following || [])) {
    if (f.removed || !f.snapshot) continue;
    const sl = f.snapshot.slots.filter(x => x.d === td);
    if (!sl.length) continue;
    const st = sl.map(x => famSlotState(f, x, td));
    const late = st.filter(x => x === 'late').length;
    notes.push(`👁 ${f.name}: ${st.filter(x => x === 'taken').length}/${sl.length}${late ? ` · ⚠ ${late}` : ''}`);
  }
  return { days, items, note: notes.join('   '), labels: { title: `${t('appName')} · ${t('today')}`, taken: t('takenAction'), check: '✓', allDone: t('wAllDone'), none: t('noneToday'), open: t('wOpen'),
    next: t('wNext'), late: t('late'), more: t('wMore')('{n}'), tomorrow: t('wTomorrow') } };
}

function famAlarms() {

  for (const f of FAM().following) {
    if (f.removed || !f.snapshot) continue;
    const meds = Object.fromEntries(f.snapshot.meds.map(m => [m.id, m]));
    const groups = new Map();
    for (const sl of f.snapshot.slots) {
      if (sl.d < td || sl.d > addDays(td, 3)) continue;
      const mk = f.marks[sl.k]; if (mk && (mk.s === 'taken' || mk.s === 'skipped')) continue;
      const m = meds[sl.m]; if (!m || m.paused) continue;
      const a = famAlert(f, m.id), at = new Date(`${sl.d}T${sl.t}:00`).getTime();

        const gk = kind + '|' + when;
        if (!groups.has(gk)) groups.set(gk, { kind, when, time: sl.t, items: [] });
        groups.get(gk).items.push({ sl, m });
      }
    }
    for (const g of groups.values()) {
      const lines = g.items.map(x => `💊 ${x.m.name} — ${fmtNum(x.sl.a)} ${x.m.unit}`).join('\n');
      const keys = g.items.map(x => x.sl.k);

          title: t('famRemindTitle')(f.name), body: lines, person: f.name, timeLabel: fmtTime(g.time),

      } else {
        out.push({ id: hashKey('fc|' + f.code + '|' + g.when), at: g.when, kind: 'check', code: f.code, keys: keys.join(','),
          title: t('famMissedTitle')(f.name), body: t('famMissedBody')(g.items.map(x => x.m.name).join(t('list')), fmtTime(g.time)),
          alt: t('famUnknownBody')(g.items.map(x => x.m.name).join(t('list')), fmtTime(g.time)), person: f.name });

function renderStats() {

  const td = today(), now = nowHM(), pid = S.active;
  let taken = 0, skipped = 0, missed = 0;
  for (let i = 0; i < statRange; i++) { const s = dayStats(pid, addDays(td, -i), now, td); taken += s.taken; skipped += s.skipped; missed += s.missed; }
  const due = taken + skipped + missed;

    el.innerHTML = `<div class="card empty">${emptyArt()}<h3>${t('stats')}</h3><p>${t('noData')}</p></div>`;
    return;
  }
  const pct = Math.round(taken / due * 100);
  const str = streak(pid);

  // Calendar: 5 weeks ending this week (Saturday-first for Arabic, Sunday-first otherwise)
  const first = S.lang === 'ar' ? 6 : 0;
  const endD = D(td); const offset = (endD.getDay() - first + 7) % 7;
  const startDay = addDays(td, -(offset + 28));
  const heads = Array.from({ length: 7 }, (_, i) => `<div class="h">${t('daysShort')[(first + i) % 7]}</div>`).join('');
  const cells = Array.from({ length: 35 }, (_, i) => {
    const d = addDays(startDay, i);
    if (d > td) return `<button class="c" style="opacity:.45" onclick="openDay('${d}')">${D(d).getDate()}</button>`;
    const s = dayStats(pid, d, now, td);
    let lv = '';
    if (s.due) { const p = s.taken / s.due; lv = p >= 1 ? 'l4' : p >= .75 ? 'l3' : p > 0 ? 'l2' : 'l1'; }
    return `<button class="c num ${lv} ${d === td ? 'today' : ''}" onclick="openDay('${d}')">${D(d).getDate()}</button>`;
  }).join('');

  // Per medicine
  const perMed = S.meds.filter(m => m.profileId === pid && !isPrn(m)).map(m => {
    let tk = 0, du = 0;
    for (let i = 0; i < statRange; i++) {
      const d = addDays(td, -i);
      for (const s of slotsFor(pid, d)) {
        if (s.med.id !== m.id) continue;
        const past = d < td || s.time <= now;
        if (s.status === 'taken') { tk++; du++; } else if (s.status || past) du++;

    </div>
    <div class="kpis" style="margin-top:12px">
      <div class="card kpi fire"><b class="num">🔥 ${str}</b><span>${t('streak')}</span></div>
      <div class="card kpi"><b class="num" style="color:var(--ok)">${taken}</b><span>${t('takenN')}</span></div>
      <div class="card kpi"><b class="num" style="color:var(--bad)">${missed + skipped}</b><span>${t('missedN')}</span></div>
    </div>
    <div class="sec-title">${I.chart}<span>${t('calendar')}</span></div>
    <div class="card"><div class="cal">${heads}${cells}</div>
      <div class="legend"><span><i style="background:color-mix(in srgb, var(--bad) 22%, var(--card))"></i>${t('lg')[0]}</span>
      <span><i style="background:color-mix(in srgb, var(--warn) 30%, var(--card))"></i>${t('lg')[1]}</span>
      <span><i style="background:color-mix(in srgb, var(--brand) 45%, var(--card))"></i>${t('lg')[2]}</span>

    <div class="card" style="padding:6px 16px">${perMed.map(({ m, p }) => `<div class="mstat"><span class="nm">${esc(m.name)}</span>
      <span class="bar"><i style="width:${p}%;background:${m.color}"></i></span><span class="pc num">${p}%</span></div>`).join('')}</div>` : ''}
    <div class="card" style="margin-top:16px;display:flex;gap:12px;align-items:center">

  const due = taken + skipped + missed;
  const perMed = S.meds.filter(m => m.profileId === pid && !isPrn(m)).map(m => {
    let tk = 0, du = 0;
    for (let i = 0; i < days; i++) {

function openModal(html) {
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = html.includes('class="grab"') ? html : `<div class="grab"></div>${html}`;
  sheet.scrollTop = 0;
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal() { document.getElementById('modal').classList.add('hidden'); }
function ask(msg, okLabel) {
  return new Promise(res => {
    const box = document.getElementById('confirm');
    document.getElementById('confirmMsg').textContent = msg;
    const yes = document.getElementById('confirmYes'), no = document.getElementById('confirmNo');
    yes.textContent = okLabel || t('yes'); no.textContent = t('cancel');
    yes.className = 'btn grow' + (okLabel === t('del') ? ' danger' : '');
    const done = v => { box.classList.add('hidden'); yes.onclick = no.onclick = null; res(v); };
    yes.onclick = () => done(true); no.onclick = () => done(false);
    box.classList.remove('hidden');
  });
}
let toastTimer;
function toast(msg, undoFn) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (undoFn) { const b = document.createElement('button'); b.textContent = t('undo'); b.onclick = () => { el.remove(); undoFn(); }; el.appendChild(b); }
  document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), undoFn ? 4000 : 2500);
}
function confetti() {
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#14b8a6', '#f59e0b', '#ec4899', '#3b82f6', '#22c55e', '#a855f7'];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + 'vw'; p.style.background = cols[i % cols.length];
    p.style.animationDelay = Math.random() * .5 + 's'; p.style.animationDuration = 1.2 + Math.random() * 1 + 's';
    p.style.transform = `rotate(${Math.random() * 360}deg)`;
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 3000);
}

let swReg = null;
if (!NATIVE && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => { if (e.data?.type === 'mark') { S = load(); mark(e.data.key, e.data.status); } });
}
function nativeNotifOk() { try { return DawaNative.notificationsAllowed(); } catch (e) { return true; } }
function notifBanner() {
  if (NATIVE && S.meds.length) {
    const st = nativeStatus();
    if (st && !alarmHealthy(st)) return `<div class="banner">${I.bell.replace('<svg', '<svg width="20" height="20"')}<span style="flex:1">${t('ckWarn')}</span>
      <button class="btn small" onclick="openCheckup()">${t('fix')}</button></div>`;
  }
  const show = S.meds.length > 0 && (NATIVE ? !nativeNotifOk() : ('Notification' in window && Notification.permission === 'default'));
  return show ? `<div class="banner">${I.bell.replace('<svg', '<svg width="20" height="20"')}<span style="flex:1">${t('enableNotifMsg')}</span>
    <button class="btn small" onclick="requestNotif()">${t('enable')}</button></div>` : '';
}
async function requestNotif() {
  if (NATIVE) { if (!nativeNotifOk()) DawaNative.openNotificationSettings(); return; }
  if (!('Notification' in window)) return;
  try { await Notification.requestPermission(); } catch (e) {}
  render();
}
async function notify(title, body, tag, data) {
  beep();
  if (NATIVE) {
    if (!data) { try { DawaNative.notifyNow(title, body); } catch (e) {} }
    toast(`${title} — ${body}`);
    return;
  }
  if (!('Notification' in window) || Notification.permission !== 'granted') { toast(`${title} — ${body}`); return; }
  const opts = { body, tag, icon: 'icon.svg', badge: 'icon.svg', requireInteraction: true, vibrate: [300, 150, 300], data,
    actions: data ? [{ action: 'taken', title: t('takenAction') }] : [] };
  try { const reg = swReg || (navigator.serviceWorker && await navigator.serviceWorker.getRegistration()); if (reg) { await reg.showNotification(title, opts); return; } } catch (e) {}
  try { new Notification(title, opts); } catch (e) { toast(`${title} — ${body}`); }
}
function testNotif() { notify(t('appName'), '✓', 'test'); }
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .22, .44].forEach((d, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 784 + i * 196; o.type = 'sine'; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.22, ctx.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + d + .2);
      o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + .22);
    });
  } catch (e) {}
}
/** In-app reminders while the app is open (Android also rings via system alarms). */
function checkReminders() {
  if (!S.user) return;
  const td = today(), nowMs = Date.now(), nowM = toMin(nowHM());
  let changed = false;
  for (const p of S.profiles) {
    for (const s of slotsFor(p.id, td)) {
      if (s.status || S.notified[s.key]) continue;
      const snoozeAt = S.snoozes[s.key] ? Date.parse(S.snoozes[s.key]) : null;
      const dueNow = snoozeAt ? nowMs >= snoozeAt : (nowM >= toMin(s.time) && nowM - toMin(s.time) <= 60);
      if (!dueNow) continue;
      S.notified[s.key] = 1; changed = true;
      if (!NATIVE && S.voice) speakBrowser(speechFor(p, [s]));
      notify(t('reminderTitle')(p.name), t('reminderBody')(s.med.name, `${fmtNum(s.amount)} ${s.med.unit}`), s.key, { key: s.key });
    }
  }
  for (const k of Object.keys(S.notified)) { const d = k.split('|')[1]; if (/^\d{4}-/.test(d) && d < addDays(td, -2)) { delete S.notified[k]; changed = true; } }
  for (const k of Object.keys(S.snoozes)) if (k.split('|')[1] < addDays(td, -1)) { delete S.snoozes[k]; changed = true; }
  if (changed) { save(); if (tab === 'today' && document.getElementById('modal').classList.contains('hidden')) render(); }
}

function hashKey(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0; return (h & 0x3fffffff) || 1; }
function buildAlarms() {
  const groups = new Map(), now = Date.now();
  for (let i = 0; i < 14; i++) {
    const d = addDays(today(), i);
    for (const p of S.profiles) for (const s of slotsFor(p.id, d)) {
      if (s.status) continue;
      const snz = S.snoozes[s.key] ? Date.parse(S.snoozes[s.key]) : null;
      const at = snz || new Date(`${d}T${s.time}:00`).getTime();
      if (at <= now) continue;
      const gk = p.id + '|' + at;
      if (!groups.has(gk)) groups.set(gk, { p, at, time: snz ? null : s.time, slots: [] });
      groups.get(gk).slots.push(s);
    }
  }
  const out = [...groups.values()].map(g => {
    const hm = g.time || (() => { const x = new Date(g.at); return `${pad(x.getHours())}:${pad(x.getMinutes())}`; })();
    const lines = g.slots.map(s => `💊 ${s.med.name} — ${fmtNum(s.amount)} ${s.med.unit}${s.med.meal && s.med.meal !== 'none' ? ' · ' + t('meals')[s.med.meal] : ''}`);
    return {
      id: hashKey(g.p.id + '|' + g.at), at: g.at, keys: g.slots.map(s => s.key).join(','),
      title: t('reminderTitle')(g.p.name), body: lines.join('\n'), person: g.p.name, timeLabel: fmtTime(hm),
      lblTaken: t('takenAction'), lblSnooze: t('snooze10'), lblClose: t('close'), lblHeader: t('alarmHeader'),
      speech: S.voice ? speechFor(g.p, g.slots) : '', lang: S.lang, voice: S.voice ? '1' : '',
      // v1 app compatibility
      key: g.slots[0].key, action: t('takenAction')
    };
  });
  try { out.push(...famAlarms()); } catch (e) {}
  for (const p of S.profiles) {
    const r = S.inr[p.id];
    if (!r?.next) continue;
    const rm = inrRem(r);
    const at = new Date(`${r.next}T${rm.dayTime}:00`).getTime();
    if (at > now) out.push({ id: hashKey('inr|' + p.id + '|' + r.next), at, keys: '', title: t('inrRemTitle'), body: t('inrRemBody')(p.name), person: p.name, timeLabel: fmtTime(rm.dayTime), lblHeader: t('inrRemTitle') });
    if (rm.prev) {
      const pat = new Date(`${addDays(r.next, -1)}T${rm.prevTime}:00`).getTime();
      if (pat > now) out.push({ id: hashKey('inrp|' + p.id + '|' + r.next), at: pat, keys: '', title: t('inrPrevTitle'), body: t('inrPrevBody')(p.name, fmtDate(r.next, { weekday: 'long', day: 'numeric', month: 'long' }), fmtTime(rm.dayTime)), person: p.name, timeLabel: fmtTime(rm.prevTime), lblHeader: t('inrPrevTitle') });
    }
  }
  return out.sort((a, b) => a.at - b.at).slice(0, 450);
}
const nativeHas = fn => NATIVE && typeof window.DawaNative[fn] === 'function';
function nativeStatus() { try { return nativeHas('status') ? JSON.parse(DawaNative.status()) : null; } catch (e) { return null; } }
/** Doses marked "taken" from the alarm screen or notification while the app was closed. */
function applyPendingMarks() {
  if (!nativeHas('takePendingMarks')) return;
  let list = [];
  try { list = JSON.parse(DawaNative.takePendingMarks() || '[]'); } catch (e) { return; }
  let n = 0;
  for (const item of list) for (const key of String(item.keys || '').split(',').filter(k => k && !k.startsWith('F|'))) {
    if (S.log[key]?.status === 'taken') continue;
    markSilently(key, item.at ? new Date(item.at).toISOString() : new Date().toISOString()); n++;
  }
  if (n) { save(); render(); toast(t('doseLogged')); }
}
function markSilently(key, atIso) {
  const [medId, date] = key.split('|');
  const med = S.meds.find(m => m.id === medId);
  const was = S.log[key]?.status;
  S.log[key] = { status: 'taken', at: atIso };
  delete S.snoozes[key];
  if (med && typeof med.stock === 'number' && was !== 'taken') { med.stock = Math.max(0, +(med.stock - amountOn(med, date)).toFixed(2)); checkLowStock(med); }
}

/* ---------- Alarm checkup (Android) ---------- */
function alarmHealthy(st) { return !st || (st.notif && st.exact); }
function openCheckup() {
  const st = nativeStatus();
  if (!st) { toast(t('oldApk')); return; }
  const row = (ok, title, hint, fn) => `<div class="set-row"><span class="ico" style="${ok ? '' : 'background:var(--bad-soft);color:var(--bad)'}">${ok ? I.check : I.x}</span>
    <div class="body">${title}<small>${hint}</small></div>${ok ? `<span class="tag ok">${t('ckOk')}</span>` : `<button class="btn small" onclick="DawaNative.${fn}()">${t('fix')}</button>`}</div>`;
  const next = st.next ? new Date(st.next) : null;
  const nextLbl = next ? `${fmtDate(ymd(next), { weekday: 'short', day: 'numeric', month: 'short' })} ${fmtTime(`${pad(next.getHours())}:${pad(next.getMinutes())}`)}` : '';
  const oem = /xiaomi|redmi|poco|huawei|honor|oppo|vivo|realme|oneplus|infinix|tecno/i.test(st.maker || '');
  openModal(`<div class="grab"></div><h3>${t('checkup')}</h3><p class="muted" style="font-size:14px;margin:-10px 0 14px">${t('checkupHint')}</p>
    <div class="card" style="box-shadow:none;border:1.5px solid var(--line);padding:2px 14px">
      ${row(st.notif, t('ckNotif'), t('ckNotifHint'), 'openNotificationSettings')}
      ${row(st.exact, t('ckExact'), t('ckExactHint'), 'openExactAlarmSettings')}
      ${row(st.fullScreen, t('ckFull'), t('ckFullHint'), 'openFullScreenSettings')}
      ${row(st.battery, t('ckBattery'), t('ckBatteryHint'), 'openBatterySettings')}
    </div>
    ${oem ? `<div class="banner" style="margin-top:12px">${I.info.replace('<svg', '<svg width="20" height="20"')}<span style="flex:1">${t('ckOem')(esc(st.maker))}</span>
      <button class="btn small" onclick="DawaNative.openAppSettings()">${t('fix')}</button></div>` : ''}
    <p class="muted num" style="font-size:13px;text-align:center;margin:14px 0">${t('ckScheduled')(st.count, nextLbl)}</p>
    <button class="btn" onclick="testNativeAlarm()">${I.bell.replace('<svg', '<svg width="20" height="20"')} ${t('testAlarm')}</button>
    <p class="muted" style="font-size:12px;text-align:center;margin-top:8px">${t('testAlarmHint')}</p>`);
}
function testNativeAlarm() {
  if (!nativeHas('testAlarm')) { toast(t('oldApk')); return; }
  const p = S.profiles.find(x => x.id === S.active) || S.profiles[0];
  DawaNative.testAlarm(JSON.stringify({ title: t('reminderTitle')(p.name), body: '💊 ' + t('testMed'), person: p.name, timeLabel: fmtTime(nowHM()),
    keys: '', lblTaken: t('takenAction'), lblSnooze: t('snooze10'), lblClose: t('close'), lblHeader: t('alarmHeader') }), 10);
  haptic(); toast(t('testSent'));
}
let nativeTimer;
function syncNative() {
  if (!NATIVE) return;
  clearTimeout(nativeTimer);
  nativeTimer = setTimeout(() => {
    try { DawaNative.schedule(JSON.stringify(S.user ? buildAlarms() : [])); } catch (e) {}
    try { if (nativeHas('setFamily')) DawaNative.setFamily(JSON.stringify(famNativeConfig())); } catch (e) {}
    try { if (nativeHas('setWidget')) DawaNative.setWidget(JSON.stringify(S.user ? widgetData() : { days: {}, items: [], labels: {} })); } catch (e) {}
  }, 300);
}

/* =====================================================================
   Boot
   ===================================================================== */
document.getElementById('onboardForm').onsubmit = e => {
  e.preventDefault();
  const name = document.getElementById('obName').value.trim(), phone = document.getElementById('obPhone').value.trim();
  if (!name) { toast(t('needName')); return; }
  const self = { id: uid(), name, relation: t('relations')[0], color: AVATAR[0] };
  S.user = { name, phone, since: today() }; S.profiles = [self]; S.active = self.id;
  haptic([20, 40, 20]); save(); render();
};
document.querySelectorAll('nav.tabs .tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; haptic(8); render(); window.scrollTo(0, 0); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { S = load(); render(); checkReminders(); famSync(true); } });
window.addEventListener('storage', e => { if (e.key === KEY) { S = load(); render(); } });

window.nativeMark = keys => {
  S = load();
  for (const key of String(keys).split(',').filter(Boolean)) if (S.log[key]?.status !== 'taken') markSilently(key, new Date().toISOString());
  save(); tab = 'today'; viewDate = null; render(); toast(t('doseLogged'));
};
window.nativeVoiceResult = r => { if (r === 'missing') toast(t('voiceMissing')); else if (r === 'noengine') toast(t('voiceNoEngine')); };
let appInBackground = false;
window.nativePause = () => { appInBackground = true; };
window.nativeResume = () => { appInBackground = false; S = load(); applyPendingMarks(); render(); checkReminders(); syncNative(); famSync(true); };
window.nativeBack = () => {
  if (!document.getElementById('confirm').classList.contains('hidden')) { document.getElementById('confirmNo').click(); return true; }
  if (!document.getElementById('modal').classList.contains('hidden')) { closeModal(); return true; }
  if (viewDate) { pickDay(null); return true; }
  if (tab !== 'today') { tab = 'today'; render(); return true; }
  return false;
};

(() => {
  const k = new URLSearchParams(location.search).get('mark');
  if (k && S.user && !S.log[k]) mark(k, 'taken', true);
  if (k) history.replaceState(null, '', location.pathname);
})();

if (S.user) save(); // persist migration
applyPendingMarks();
render();
checkReminders();
syncNative();
famSync(true);
setInterval(() => {
  checkReminders();
  if (!document.hidden && !appInBackground) famSync();
  if (tab === 'today' && document.getElementById('modal').classList.contains('hidden') && document.getElementById('confirm').classList.contains('hidden')) renderToday();
}, 30000);
</script>
