plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.hamza.dawa'
    compileSdk 34

    defaultConfig {
        applicationId "com.hamza.dawa"
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Release key comes from GitHub Secrets (never stored in the repository)
    signingConfigs {
        dawa {
            storeFile file(System.getenv("DAWA_KEYSTORE_FILE") ?: "release.jks")
            storePassword System.getenv("DAWA_KEY_PASS")
            keyAlias 'dawa'
            keyPassword System.getenv("DAWA_KEY_PASS")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.dawa
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
