name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy the web app into the Android project
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html sw.js manifest.json icon.svg android/app/src/main/assets/www/

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - run: cp android/app/build/outputs/apk/release/app-release.apk Dawa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Dawa-apk
          path: Dawa.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dawa 1.0.${{ github.run_number }}
          files: Dawa.apk
          make_latest: 'true'
